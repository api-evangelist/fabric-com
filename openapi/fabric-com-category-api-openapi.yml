            $ref: '#/components/schemas/Breadcrumbs'
        attributes:
          description: Attributes belonging to this category
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        children:
          description: Children categories of this category
          type: array
          items:
            $ref: '#/components/schemas/CategoryChild'
        createdOn:
          type: string
          example: '2022-03-09T23:37:54.086Z'
          description: Time of category creation (UTC format)
        modifiedOn:
          type: string
          description: Time when category was last updated (UTC format)
          example: '2022-03-09T23:37:54.086Z'
    SKUPage:
      type: object
      properties:
        totalSize:
          description: Total number of records
          type: number
          example: 3
        pageSize:
          description: Number of records (SKUs) per page
          type: number
          example: 10
        pages:
          description: Number of pages for the given `pageSize`
          type: number
          example: 1
        id:
          type: string
          example: 6196b45b5cb04b7ce167cb46
          description: A 24-character system-generated category ID
        nodeId:
          type: number
          example: 2
          description: Numeric category ID
        name:
          type: string
          example: electronics
          description: Numeric category ID
        skus:
          description: SKUs of items belonging to this category.
          type: array
          example:
          - mobo12001
          - mobo12002
          - mobo12003
          items:
            type: string
    NodeSourcesAndExclusions:
      type: object
      properties:
        id:
          type: string
          example: 6170135a49b4af38190970fe
          description: A 24-character system-generated category ID
        nodeId:
          type: number
          example: 12
          description: Numeric category ID
        name:
          type: string
          example: Furniture
          description: Category name
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 61701259125b7225cbfb21b9
                description: A 24-character system-generated category ID
              name:
                type: string
                example: picture
                description: Category name
              breadcrumbString:
                type: string
                example: PRIMARY/Furniture/Chairs
                description: Path of categories leading to source of categories
        sourceExclusions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 61701259125b7225cbfb21b9
                description: A 24-character system-generated category ID
              name:
                type: string
                example: picture
                description: Category name
              breadcrumbString:
                type: string
                example: PRIMARY/Furniture/Chairs
                description: Path of categories leading to root of categories
    CreateCategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          description: Category name
          type: string
          example: notes
        active:
          description: 'true: Category is Active <br /> false: Category is Inactive <br /> **Note**: When `type` is Primary, `status` must be Active. Inactive status is not applicable for Primary category.'
          type: boolean
          example: true
        parentNodeId:
          description: Numeric ID of parent category. If omitted, new category is created under the root category.
          type: number
          example: 1
        order:
          description: 'The order in which this child category appears among the sibling categories (of the same parent). <br /> **Note**: <br /> 1) Applicable only for children categories. <br /> 2) Order 0 means this child category appears at the beginning of other sibling categories. <br /> 3) Unless order is specified, the child category appears at the end.'
          type: number
          example: 3
        type:
          type: string
          enum:
          - ALTERNATE
          - PRIMARY
          description: Category type. Specify this field to create a new root category. Applicable only if `parentNodeId` is omitted.
    CategoryAttributeMatchValue:
      type: object
      properties:
        exact:
          description: Exact value to match
          oneOf:
          - type: string
          - type: integer
          - type: boolean
          example: '1234'
        contains:
          description: Value to match as a substring
          type: string
          example: '1234'
    ClientError:
      type: object
      properties:
        code:
          description: Error code for machine consumption
          type: string
          example: 400
        message:
          description: Human-readable error description
          type: string
          example: Client error
    findCategoryRequest:
      type: object
      properties:
        include:
          type: object
          description: Inclusion criteria
          properties:
            children:
              description: 'true: Include children in the response <br /> false: Exclude children from response'
              example: false
              type: boolean
            itemAttributes:
              description: 'true: Include item attributes in the response <br /> false: Exclude item attributes from the response'
              example: false
              type: boolean
            nodeAttributes:
              description: 'true: Include category attributes in the response <br /> false: Exclude category attributes from the response'
              example: false
              type: boolean
            filters:
              description: 'true: Include attributes in the response <br /> false: Exclude attributes from the response'
              example: false
              type: boolean
            sources:
              description: 'true: Include sources in the response <br /> false: Exclude sources from the response'
              example: false
              type: boolean
            statuses:
              description: 'true: Include statuses in the response <br /> false: Exclude statuses from the response'
              example: true
              type: boolean
        type:
          description: Category type. The primary hierarchy contains all branches, whereas alternate hierarchies exist to export alternate organizations of the primary hierarchy. If omitted `ALTERNATE` is considered by default.
          example: ALTERNATE
          type: string
          enum:
          - PRIMARY
          - ALTERNATE
        status:
          description: Category status. Only ALTERNATE Hierarchies can be filtered using this paramater. If omitted `ACTIVE` status is considered by default.
          example: ALL
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - ALL
        page:
          description: Number of pages in the response.
          type: number
          example: 1
        size:
          description: Number of categories per page.
          type: number
          example: 10
        match:
          type: object
          properties:
            attribute:
              $ref: '#/components/schemas/CategoryAttributeMatch'
            and:
              type: array
              items:
                type: object
                properties:
                  attribute:
                    $ref: '#/components/schemas/CategoryAttributeMatch'
            or:
              type: array
              items:
                type: object
                properties:
                  attribute:
                    $ref: '#/components/schemas/CategoryAttributeMatch'
    NodeSourceExclusions:
      type: object
      properties:
        totalSize:
          description: Total number of records
          type: number
          example: 100
        pageSize:
          description: Number of records (categories) in a page
          type: number
          example: 10
        pages:
          description: Number of pages for the given `pageSize`
          type: number
          example: 10
        id:
          type: string
          example: 6170135a49b4af38190970fe
          description: A 24-character system-generated category ID.
        nodeId:
          type: number
          example: 12
          description: Numeric category ID
        name:
          type: string
          example: Furniture
          description: Category name
        sourceExclusions:
          type: array
          items:
            type: object
            properties:
