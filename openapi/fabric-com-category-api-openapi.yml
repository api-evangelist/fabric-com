                - UNSET
                description: Action type
              attributeId:
                type: string
                example: 609ac75051f11a0007cf38b3
                description: A 24-character system-generated attribute ID
              mandatory:
                type: boolean
                example: false
                description: 'true: Attribute is mandatory <br /> false: Attribute is optional'
    ModifyCategoryAttributesRequest:
      type: object
      required:
      - attributes
      properties:
        id:
          description: A 24-character system-generated category ID. `nodeId` and `id` are the two identifier of a category, and one of them must be specified.
          type: string
          example: 6196b45b5cb04b7ce167cb46
        nodeId:
          description: Numeric category ID. `nodeId` and `id` are the two identifier of a category, and one of them must be specified.
          type: number
          example: 25
        attributes:
          description: Details of category attributes
          type: array
          items:
            type: object
            required:
            - action
            - attributeId
            properties:
              action:
                type: string
                enum:
                - SET
                - UNSET
                description: Action type
              attributeId:
                type: string
                example: 609ac75051f11a0007cf38b3
                description: A 24-character system-generated attribute ID
              value:
                oneOf:
                - type: boolean
                - type: number
                - type: string
  parameters:
    MandatoryPage:
      in: query
      name: page
      description: Page number to be retrieved. Applicable only in a paginated response and always paired with `size`.
      example: 1
      schema:
        type: number
      required: true
    Size:
      in: query
      name: size
      description: 'Number of records per page <br /> **Note**: <br /> 1) Always paired with `page`. <br /> 2) Applicable only in a paginated response. <br /> 3) No default value set. Unless a value is specified, endpoint returns an error.'
      example: 10
      schema:
        type: number
    xSiteContent:
      name: x-site-context
      in: header
      description: The `x-site-context` header is a JSON object that contains information about the source you wish to pull from. The mandatory `account` is the 24 character identifier found in Copilot. The `channel` (Sales channel ID), `stage` (environment name), and `date` attributes can be used to further narrow the scope of your data source.
      required: true
      schema:
        type: string
        example: '{"date": "2023-01-01T00:00:00.000Z", "channel": 12, "account": "1234abcd5678efgh9ijklmno","stage":"production"}'
    Page:
      in: query
      name: page
      description: 'Page number to be retrieved. <br /> **Note**: <br /> 1) Applicable only in a paginated response.  <br /> 2) Always paired with `size` <br /> 3) No default value set. Unless a value is specified, endpoint returns an error.'
      example: 1
      schema:
        type: number
    MandatorySize:
      in: query
      name: size
      description: Number of records per page. Applicable only in a paginated response and always paired with `page`.
      example: 10
      schema:
        type: number
      required: true
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      description: The `x-api-key` enables you to access the fabric API without `Authorization`. You must request fabric Inc to obtain this key.<br />Authorization` header is required if `x-api-key` is omitted.
      in: header
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: S2S access token (JWT) from fabric Identity service (during Login)
externalDocs:
  description: Find out more about Product Catalog
  url: /v3/product-catalog/user-guides/product-catalog/overview
