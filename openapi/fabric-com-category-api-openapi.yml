                example: 6196b45b5cb04b7ce167cb46
              nodeId:
                type: number
                description: Numeric category ID. `nodeId` and `id` are the two identifier of a category, and one of them must be specified.
                example: 25
              attributeId:
                type: string
                description: A 24-character system-generated attribute ID
                example: 609ac75051f11a0007cf38b3
              mandatory:
                type: boolean
                description: 'true: Attribute is mandatory <br /> false: Attribute is optional'
                example: false
    CategoryItemAttributeConditionsRequest:
      type: object
      required:
      - itemAttributes
      properties:
        id:
          description: A 24-character system-generated category ID. `nodeId` and `id` are the two identifier of a category, and one of them must be specified.
          type: string
          example: 6196b45b5cb04b7ce167cb46
        nodeId:
          description: Numeric category ID. `nodeId` and `id` are the two identifier of a category, and one of them must be specified.
          type: number
          example: 25
        itemAttributeConditions:
          description: Details of conditions set or unset
          type: array
          items:
            type: object
            required:
            - action
            - attributeId
            properties:
              action:
                type: string
                enum:
                - SET
                - UNSET
                description: Action type
              attributeId:
                type: string
                example: 609ac75051f11a0007cf38b3
                description: A 24-character system-generated attribute ID
              condition:
                type: object
                required:
                - type
                properties:
                  type:
                    description: Applicable criteria
                    type: string
                    enum:
                    - 'YES'
                    - 'NO'
                    - CONTAINS
                    - DOES_NOT_CONTAIN
                    - IS_EXACT_MATCH
                    - IS_EQUAL_TO
                    - IS_GREATER_THAN
                    - IS_LESS_THAN
                    - INCLUDES
                    - EXCLUDES
                    example: CONTAINS
                  value:
