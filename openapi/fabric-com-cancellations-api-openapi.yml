          description: Merchant-defined custom attributes. This is a placeholder for additional info (in key-value pairs).
          example:
            isPerishable: 'false'
          type: object
        employeeId:
          description: Employee (ID or name) who initiated the order cancellation request
          example: '12312232'
          type: string
        items:
          description: Cancellation request
          items:
            $ref: '#/components/schemas/orderCancelLineItem'
          type: array
        note:
          description: Additional notes, if any
          example: This is a note
          type: string
        policyCode:
          description: Merchant-defined policy code, varies from merchant to merchant. If omitted, the default policy is used.
          example: RC1
          type: string
        reasonCode:
          description: Reason code for cancellation, varies from merchant to merchant
          example: Incorrect order
          type: string
        releaseSoftReservation:
          type: boolean
        source:
          description: Merchant-defined source from where the cancellation request was initiated. There are no pre-defined values; possible values could be Customer Service Representative (CSR), point-of-sale (POS), etc.
          example: CSR
          type: string
        subReasonCode:
          description: Subreason code for order cancellation, for another layer of classification
          example: Incorrect specification
          type: string
        requestContext:
          $ref: '#/components/schemas/requestReferenceContextResource'
          description: Request reference context information
      required:
      - reasonCode
      type: object
    amountInCurrency:
      description: Amount in currency object details.
      properties:
        amount:
          description: The amount displayed in the primary currency.
          example: 123.45
          format: double
          type: number
        currency:
          description: Currency in ISO-4217
          example: USD
          type: string
        group:
          description: A unique identifier for currencies. All calculations and invoicing are based on this identifier. For example, the `Shopper` group uses USD, while the `Retailer` group uses EUR.
          example: SHOPPER
          type: string
      required:
      - currency
      - group
      type: object
    address:
      description: Address details
      properties:
        addressLine1:
          description: Address line 1
          example: 123 Main St.
          type: string
        addressLine2:
          description: Address line 2
          example: Suite 100
          type: string
        addressLine3:
          description: Address line 3
          example: Seventh floor
          type: string
        addressLine4:
          description: Address line 4
          example: 'Attention: Pat E. Kake'
          type: string
        city:
          description: City name
          example: Seattle
          type: string
        countryCode:
          description: ISO 3166-1 alpha-2 based country code
          example: US
          type: string
        email:
          description: Contact person's email
          example: test@example.com
          type: string
        latitude:
          description: Address latitude, used with `longitude` to specify the address location. Decimal degrees format; negative is degrees South.**Note:**Value must be between -90 and 90, both inclusive.
          example: 47.6205
          format: double
          type: number
        longitude:
          description: Address longitude, used with `latitude` to specify the address location. Decimal degrees format; negative is degrees South. **Note:**Value must be between -180 and 180, both inclusive.
          example: -122.3493
          format: double
          type: number
        name:
          $ref: '#/components/schemas/orderContactName'
        phone:
          $ref: '#/components/schemas/orderContactPhone'
        postalCode:
          description: Postal or ZIP code
          example: '98121'
          type: string
        region:
          description: Region or state
          example: WA
          type: string
        type:
          description: Address type
          example: Home
          type: string
      required:
      - addressLine1
      - city
      - countryCode
      - latitude
      - longitude
      - postalCode
      - region
      - type
      type: object
    orderPickup:
      description: An object containing the order pickup details.
      properties:
        email:
          description: Contact person's email
          example: test@example.com
          type: string
        name:
          $ref: '#/components/schemas/orderContactName'
        phone:
          $ref: '#/components/schemas/orderContactPhone'
        pickupType:
          description: Order pickup type
          enum:
          - PRIMARY
          - ALTERNATE
          example: PRIMARY
          type: string
      type: object
    eligibilityResponse:
      description: Eligibility details object.
      properties:
        eligibleReasonCodes:
          description: Reason codes for returns
          items:
            $ref: '#/components/schemas/reasonCodeAndDescription'
          type: array
        fees:
          description: Fee details
          items:
            $ref: '#/components/schemas/policyFeeResource'
          type: array
        items:
          description: Item's eligibility for return, cancellation, or exchange
          items:
            $ref: '#/components/schemas/itemEligibilityResource'
          type: array
        orderId:
          description: 24-character system-generated order ID
          example: 62f3982438bcab1951be0a19
          type: string
        period:
          description: Return, exchange or cancellation window as per merchant policy
          example: 30D00H00M
          type: string
        policyType:
          description: Policy type that determines eligibility of exchange, return, or cancellation. If omitted, the default policy is considered.
          example: Company Policy 2023
          type: string
      type: object
    invoiceCustomer:
      description: Invoice customer
      properties:
        accountId:
          description: Customer's loyalty account ID or external identifier that is used to track their loyalty program activity and rewards earned.
          example: 62272e917b12209e68751d94
          type: string
        company:
          description: Shopper's company name. This may be used for company discounts.
          example: Demo Inc
          type: string
        email:
          description: Contact person's email
          example: test@example.com
          type: string
        employeeId:
          description: Employee (ID or name) who initiated an update request
          example: 62272e917b12209e68751d94
          type: string
        name:
          $ref: '#/components/schemas/orderContactName'
        phone:
          $ref: '#/components/schemas/orderContactPhone'
        userId:
          description: Identifier of the logged in user who initiated the request. This could be from either fabric Identity service or an external Identity service.
          example: 62272e917b12209e68751d94
          type: string
      type: object
    orderItem:
      description: An object containing an orders item details.
      properties:
        adjustments:
          description: Price adjustments are made to modify product prices during order creation, aiming to incentivize shoppers by offering discounts and promotions based on specified criteria. Price adjustments are also made to apply coupons that the shopper has used.
          items:
            $ref: '#/components/schemas/adjustmentDetail'
          type: array
        appeasementTotal:
          description: Appeasement total = `summationOfAll(appeasements[].amount and items[].appeasements[].amount)`
          example: 5.5
          format: double
          type: number
        appeasementTotalInCurrencies:
          items:
            description: The total appeasement amount, calculated as the sum of all `appeasements[].amount` and `items[].appeasements[].amount` values, expressed in all currencies used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        appeasements:
          description: Appeasement info
          items:
            $ref: '#/components/schemas/orderAppeasementDetail'
          type: array
        attributes:
          description: Merchant-defined custom attributes. This is a placeholder for additional info (in key-value pairs).
          example:
            colorCode: '001'
            isDonation: 'false'
            style: '570223020'
          type: object
        backOrderedQuantity:
          description: Backordered quantity of given item
          example: 10
          format: int32
          type: integer
        cancellations:
          items:
            $ref: '#/components/schemas/cancellationItemResource'
          type: array
        cancelledAmount:
          description: Cancelled amount is either voided (payment is only authorized but not captured at checkout) or refunded (amount is authorized and captured at checkout).
          example: 12.4
          format: double
          type: number
        cancelledAmountInCurrencies:
          items:
            description: The total amount cancelled, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        cancelledQuantity:
          description: Cancelled quantity of an item
          example: 10
          format: int32
          type: integer
        channelId:
          description: Sales channel ID
          example: WHBM
          type: string
        currency:
          description: Three-letter currency code as defined by ISO-4217
          example: USD
          type: string
        deliveredQuantity:
          description: Delivered quantity of an item
          example: 10
          format: int32
          type: integer
        discounts:
          description: Discount details
          items:
            $ref: '#/components/schemas/orderDiscount'
          type: array
        employeeId:
          description: Employee (ID or name) who initiated the request
          example: 5345HJH
          type: string
        exchangeQuantity:
          description: System-generated item quantity that are exchanged
          example: 13
          format: int32
          type: integer
        fees:
          description: Fee details
          items:
            $ref: '#/components/schemas/itemFeeDetails'
          type: array
        fulfillment:
          $ref: '#/components/schemas/itemFulfillmentResource'
        hasInfiniteConsent:
          description: Applicable for backorder and preorder scenarios where customer consents for further delay in delivery of preordered and backordered items than the initial estimate. **true:** Customer consents for delayed delivery. **false:** Customer does not consent for delayed delivery.
          example: true
          type: boolean
        invoiceTotal:
          description: Invoice total is updated once invoice created
          example: 800
          format: double
          type: number
        invoiceTotalInCurrencies:
          items:
            description: The total amount to be charged for the invoice, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        invoicedQuantity:
          description: Invoiced quantity of an item
          example: 10
          format: int32
          type: integer
        isBackorder:
          description: Merchant-defined value. **true:** Backordered item. **false:** Ordered item.
          example: true
          type: boolean
        isDonation:
          description: '**true:** Item is a donation. **false:** Item is not a donation.'
          example: true
          type: boolean
        isExchangeItem:
          description: Merchant-defined value for exchange scenarios. **true:** Item is an exchange. **false:** Item is not an exchange.
          example: true
          type: boolean
        isGifting:
          description: '**true:** Item is a gift. **false:** Item is not a gift.'
          example: true
          type: boolean
        isPreorder:
          description: Merchant-defined value. **true:** Pre-ordered item. **false:** Ordered item.
          example: true
          type: boolean
        isFulfillable:
          type: boolean
          description: "Determines whether an **Allocation** document must be created before fulfillment.  \n- If `false`, the allocation step is skipped and the process continues directly to **Invoice & Payment Capture**.  \n- If omitted, the system defaults to `true`.\n"
          example: true
          default: true
        isInventoryManaged:
          type: boolean
          description: "Indicates whether the **On-Hand / Available to Purchase** quantity is managed in fabric OMS.  \n- If `false`, inventory management is bypassed and no inventory document is created in OMS.  \n- If omitted, the system defaults to `true`.\n"
          example: true
          default: true
        itemAdjustmentTotal:
          description: Total price adjustment made to the item.
          example: 123.45
          format: double
          type: number
        itemAdjustmentTotalInCurrencies:
          items:
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemDiscountsTotal:
          description: Item's total discount = `summationOfAll(discounts[].amount)'. Refer to `amount` in `orderDiscount`.
          example: 80
          format: double
          type: number
        itemDiscountsTotalInCurrencies:
          items:
            description: The total discount applied to an item, calculated as the sum of all `discounts[].amount` values, expressed in all currencies used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemFeeTotal:
          description: Recalculated item's fee = `summationOfAll(itemFeeTotal)`. Refer to `amount` in `itemFeeDetails`
          example: 200
          format: double
          type: number
        itemFeeTotalInCurrencies:
          items:
            description: The updated fee for an item, calculated as the sum of all `itemFeeTotal` values, expressed in all currencies used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemId:
          description: System-generated unique identifier of item from fabric Products (PIM) service
          example: 1234
          format: int32
          type: integer
        itemName:
          description: Item name
          example: Item
          type: string
        itemShippingTotal:
          description: Merchant-defined item's shipping total
          example: 10
          format: double
          type: number
        itemShippingTotalInCurrencies:
          items:
            description: The updated total shipping cost for an item, expressed in all currencies used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemSubtotal:
          description: Recalculated item's subtotal = `itemUnitPrice x (orderedQuantity - cancelledQuantity)`
          example: 600
          format: double
          type: number
        itemSubtotalInCurrencies:
          items:
            description: The updated subtotal for an item, calculated as `itemUnitPrice x (orderedQuantity - cancelledQuantity)`, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemSubtype:
          description: Subtype of `type`, for another layer of classification.
          example: Borderfree
          type: string
        itemTaxTotal:
          description: Recalculated total tax on item = `summationOfAll(itemTaxTotal)`
          example: 80
          format: double
          type: number
        itemTaxTotalInCurrencies:
          items:
            description: The updated total tax on an item, calculated as the sum of all `itemTaxTotal` values, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemTotal:
          description: Recalculated item's total cost = `itemSubTotal - itemDiscountTotal  + itemTaxTotal + itemFeeTotal`.
          example: 800
          format: double
          type: number
        itemTotalInCurrencies:
          items:
            description: The updated total cost of an item, calculated as `itemSubTotal - itemDiscountTotal + itemTaxTotal + itemFeeTotal`, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        itemUnitPrice:
          description: Item's unit price
          example: 10
          format: double
          type: number
        itemUnitPriceInCurrencies:
          items:
            description: The price of a single unit of an item, itemized by each currency used within the order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        lineItemId:
          description: Merchant-defined unique identifier for each item in an order. When omitted, fabric will generate it (in UUID format) during order creation.
          example: d538b1f1-0e45-43c6-bfc6-9666fc1188ca
          type: string
        lineItemNumber:
          description: Merchant-defined line item number to identify each item in an order
          example: 1
          format: int32
          type: integer
        lineOrderStatus:
          description: System-generated status for each item in the orders - SHIPPED, RETURNED, CANCELLED, EXCHANGED, VALID, and the like
          example: VALID
          type: string
        notes:
          description: For additional information, to be used by Customer Service Representative (CSR) only
          items:
            $ref: '#/components/schemas/orderNote'
          type: array
        orderedQuantity:
          description: Ordered quantity of given item
          example: 60
          format: int32
          type: integer
        orderedQuantityToShip:
          description: Quantity of given item that is yet to ship, out of the initially allocated quantity. For example, if a customer orders four units of an item, inventory will reserve four units of the item. If only two units are currently available and are shipped, the remaining two units will be considered as the `pendingShippedQuantity`.
          example: 10
          format: int32
          type: integer
        originalDiscounts:
          description: System-generated total discount, auto-filled by Orders service when the order is placed.
          example: 50
          format: double
          type: number
        originalDiscountsInCurrencies:
          items:
            description: The initial discounts applied, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalFeeTotal:
          description: System-generated fee total, auto-filled by fabric Orders when the order is placed. This is saved for reference in case the value changes later.
          example: 300
          format: double
          type: number
        originalFeeTotalInCurrencies:
          items:
            description: The initial total fee amount, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalItemAdjustmentTotalInCurrencies:
          items:
            description: The initial total value of item adjustments, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalItemSubtotal:
          description: System-generated total discount, auto-filled by Orders service when the order is placed.
          example: 800
          format: double
          type: number
        originalItemSubtotalInCurrencies:
          items:
            description: The initial subtotal for an item, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalItemTotal:
          description: System-generated item total cost, auto-filled by Orders service when the order is placed
          example: 500
          format: double
          type: number
        originalItemTotalInCurrencies:
          items:
            description: The initial total cost of an item, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalOutstandingItemTotalInCurrencies:
          items:
            description: The initial outstanding total cost of items that had not yet been paid for, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalShippingTotal:
          description: System-generated total shipping cost, auto-filled by Orders service when the order is placed.
          example: 80
          format: double
          type: number
        originalShippingTotalInCurrencies:
          items:
            description: The initial total shipping cost, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        originalTaxTotal:
          description: System-generated total tax, auto-filled by Orders service when the order is placed.
          example: 90
          format: double
          type: number
        originalTaxTotalInCurrencies:
          items:
            description: The initial total tax amount, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        outstandingItemTotalInCurrencies:
          items:
            description: The remaining total cost of items that have not yet been paid for, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        parentLineItemNumber:
          description: Applicable in exchange scenarios. Item being returned is the `parentLineItemNumber`.
          example: 12
          format: int32
          type: integer
        pendingExchangeQuantity:
          description: System-generated item quantity pending for exchange
          example: 12
          format: int32
          type: integer
        pendingReturnQuantity:
          description: Quantity of an item awaiting approval for return. For example, when customer initiates return request for 2 units of an item, the request will be initially in a pending status because they are awaiting approval from merchant. They are referred to as `pendingReturnQuantity`.
          example: 10
          format: int32
          type: integer
        pendingShippedBackOrderQuantity:
          description: Backordered quantity that is yet to be shipped. For example, If a customer places a backorder for four units of an item, inventory will reserve four units of the item to ship when they become available. If only two units are available and are shipped, the remaining two backordered units will be considered as the `pendingShippedBackOrderQuantity`.
          example: 10
          format: int32
          type: integer
        processingReturnQuantity:
          description: Quantity of an item currently being processed for return. For example, when merchant approves return of 1 out of 2 units of an item, then 1 is the `processingReturnQuantity`
          example: 10
          format: int32
          type: integer
        quantityInStatus:
          $ref: '#/components/schemas/quantityInStatus'
        refundAmount:
          description: Merchant-defined total refund amount
          example: 21.5
          format: double
          type: number
        refundAmountInCurrencies:
          items:
            description: The total refund amount, itemized by each currency used within a specific order.
            $ref: '#/components/schemas/amountInCurrencyResource'
          type: array
        rejectedReturnQuantity:
          description: Quantity of an item rejected in return request. For example, For example, when merchant rejects return of 1 out of 2 units of an item, then 1 is the `rejectedReturnQuantity`.
          example: 10
          format: int32
          type: integer
        reshippedQuantity:
          description: Reshipped quantity of given item (in case of lost shipment)
          example: 10
          format: int32
          type: integer
        returnedQuantity:
          description: Returned quantity of given item
          example: 10
          format: int32
          type: integer
        returns:
          description: Order return details
          items:
            $ref: '#/components/schemas/orderReturns'
          type: array
        shipToId:
          description: 'System-generated ship-to ID (UUID) associated with `shipInfo`, generated from CnC service. **Note**: An order can have multiple ship-to (delivery) locations and items going to the one location will have the same `shipToId`.'
          example: b03b72dc-78d8-4ea4-90fc-2fe6a1fe6569
          type: string
        shippedQuantity:
          description: Shipped quantity of an item
          example: 10
          format: int32
          type: integer
        sku:
          description: Stock keeping unit (SKU), unique identifier of item
          example: P1234
          type: string
        taxCode:
          description: Applicable tax code, varies from state to state
          example: FR01
          type: string
        taxDetails:
          description: Tax details
          items:
            $ref: '#/components/schemas/taxDetail'
          type: array
        type:
          description: Order type. Critical in order life cycle as it indicates the workflow that varies with the type. For example, Storefront orders have a different workflow than Call Center orders. fabric Orders service offers default configurations for Storefront, Call Center, Point of Sale, iOS, Android, and International.
          example: WEB_SHIP
          type: string
        uom:
          description: Unit in which a product is sold or measured. It is important to accurately fulfill orders and ensure customers receive the correct quantity of products they have ordered. The possible values are EA (Each) or GAL (Gallon), DZ (Dozen), etc.
          example: EA
          type: string
        vendorId:
          description: Vendor ID. Applicable in drop shipping to indicate vendor responsible for given item.
          example: P1234
          type: string
      required:
      - itemId
      - lineItemId
      - lineItemNumber
      - shipToId
      - sku
      type: object
  parameters:
    xFabricChannelId:
      description: x-fabric-channel-id identifies the sales channel where the API request is being made; primarily for multichannel use cases. The channel ids are 12 corresponding to US and 13 corresponding to Canada. The default channel id is 12. This field is required.
      example: '12'
      in: header
      name: x-fabric-channel-id
      required: true
      schema:
        type: string
    xFabricRequestId:
      description: Unique request ID
      example: 263e731c-45c8-11ed-b878-0242ac120002
      in: header
      name: x-fabric-request-id
      required: false
      schema:
        type: string
    xFabricTenantId:
      description: A header used by fabric to identify the tenant making the request. You must include tenant id in the authentication header for an API request to access any of fabric’s endpoints. You can retrieve the tenant id , which is also called account id, from [Copilot](/v3/platform/settings/account-details/getting-the-account-id). This header is required.
      example: 5f328bf0b5f328bf0b5f328b
      in: header
      name: x-fabric-tenant-id
      required: true
      schema:
        type: string
  headers:
    xFabricRequestIdResponseHeader:
      description: Unique request ID
      example: 263e731c-45c8-11ed-b878-0242ac120002
      required: false
      schema:
        type: string
  securitySchemes:
    authorization:
      bearerFormat: JWT
      scheme: bearer
      type: http
externalDocs:
  description: Find out more about fabric Orders (also called OMS)
  url: https://developer.fabric.inc/v3/docs/orders-overview
x-mint:
  mcp:
    enabled: true
